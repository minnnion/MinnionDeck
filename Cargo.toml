[package]
name = "minniondeck-ui"
version = "0.1.2"
edition = "2024"
description = "MinnionDeck desktop app in native Rust"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
egui = { version = "0.37", default-features = false }
png = { version = "0.17", default-features = false }
# Your pictures and GIFs: PNG, JPEG, GIF (frames put together, as a browser plays them) and WebP
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# library.json, in the same format as the Minniondeck app's (keys keep their order)
serde_json = { version = "1", features = ["preserve_order"] }
# Plugins: native DLLs loaded in a helper process, Ed25519 signatures, DPAPI-locked settings
serde = { version = "1", features = ["derive"] }
libloading = "0.8"
ring = "0.17"
base64 = "0.22"
# .mdprofile and .mdplugin files: encrypted zips
aes-gcm = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Phones: a web page served over HTTPS with a certificate this PC makes, a WebSocket for live buttons, a QR
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
tungstenite = "0.26"
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
# Marketplace downloads
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# Start with Windows (the Run key) and the taskbar colour the tray icon follows
winreg = "0.55"
# Button actions: key presses, typing, mouse clicks, opening programs, volume, the microphone,
# and the "Allow imported buttons?" question
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Shutdown",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Time",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Shell_Common",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
] }

[profile.release]
opt-level = 3
codegen-units = 16
strip = true

