# Every push and pull request: build, run the tests, lint, and check the dependencies for known
# security advisories. MinnionDeck is a Windows app, so it runs on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # once a week, so a new advisory for a dependency shows up even without a push
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
