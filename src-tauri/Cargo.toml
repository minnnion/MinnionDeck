[package]
name = "minniondeck"
version = "0.1.0"
description = "Minniondeck"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "minniondeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["time", "net", "rt", "sync", "macros", "io-util"] }
# Phone connection: an always-on WebSocket server over TLS, pinned by a fingerprint in the pairing QR
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
qrcode = { version = "0.14", default-features = false }
local-ip-address = "0.6"
# Saved files: .mdprofile and backup packages are encrypted zips
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
# Street map tiles for live map buttons, fetched with the app's name and kept on disk
ureq = { version = "2", default-features = false, features = ["tls"] }
libloading = "0.8"
# Plugin signatures (Ed25519); ring is already used by the phone connection
ring = "0.17"
# Speech (speech.rs): Gradium's Phonon text to speech, pure Rust. Pinned (0.5.0 came out the day it
# was added); no "hub" feature, so the app can't download a model: it reads minnion_speech's files
ptts = { version = "=0.5.0", default-features = false, features = ["hf"] }
# ptts's maths library, named here only to cap its worker threads (speech.rs SPEECH_THREADS)
xn = { version = "=0.2.12", default-features = false }

[target.'cfg(windows)'.dependencies]
# Registers .mdprofile so a double-click opens it in Minniondeck
winreg = "0.55"
# Button actions: key presses, typing, mouse clicks, opening programs, volume and the microphone
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Shutdown",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Threading",
  "Win32_Graphics_Gdi",
  "Win32_System_Console",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Registry",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Fast to build: the crate is cut into 256 code units, so all 16 threads always have work and a
# change re-optimises only the small units it touches (26 s -> 5 s for one file, 2026-10-31); only
# what changed is rebuilt (incremental),
# no whole-program LTO. With lto = true and codegen-units = 1 a one-line change took 3.5-5 min,
# because the whole app (Tauri, the speech model's maths, TLS...) was re-optimised on one core.
[profile.release]
codegen-units = 256
lto = false
incremental = true
opt-level = 3
panic = "abort"
strip = true
